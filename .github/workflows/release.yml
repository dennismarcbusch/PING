name: Release

# Tag "v1.0"           -> baut alle Pakete, Release + GitHub Pages
# Tag "pc-aufbau-v1.2" -> baut nur dieses Paket, nur Release
# Pages bekommt nur vollständige Builds, sonst fehlten dort die übrigen Pakete.
on:
  push:
    tags: ['v*', '*-v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.zips.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: ZIPs bauen
        id: zips
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          if [[ "$GITHUB_REF_TYPE" != tag || "$tag" == v* ]]; then
            ./build.sh
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            ./build.sh "${tag%-v*}"
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scorm-pakete
          path: dist/*.zip
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
      - name: Pages-Seite vorbereiten
        if: steps.zips.outputs.full == 'true'
        run: |
          mkdir -p site && cp dist/*.zip site/
          {
            echo '<!doctype html><meta charset="utf-8"><title>PING SCORM-Pakete</title>'
            echo "<h1>PING – SCORM-Pakete</h1><p>Stand: ${GITHUB_REF_NAME}</p><ul>"
            for f in site/*.zip; do n=$(basename "$f"); echo "<li><a href=\"$n\">$n</a></li>"; done
            echo '</ul>'
          } > site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.zips.outputs.full == 'true'
        with:
          path: site

  pages:
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
