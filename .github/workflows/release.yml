name: Release

# Tag "v1.0"           -> baut alle Pakete
# Tag "pc-aufbau-v1.2" -> baut nur dieses Paket
on:
  push:
    tags: ['v*', '*-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIPs bauen
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          if [[ "$tag" == v* || "$tag" == manual ]]; then
            ./build.sh
          else
            ./build.sh "${tag%-v*}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scorm-pakete
          path: dist/*.zip
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
