<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plug &amp; Pray – Aufbau eines modernen PCs</title>
<style>
:root{
  --bg:#eef2f8; --card:#ffffff; --card2:#f6f8fc; --ink:#1b2333; --ink-soft:#4a5568; --muted:#6b7588; --line:#dbe2ec;
  --accent:#2f6fde; --accent-soft:#e3ecfd; --ok:#1f9d55; --ok-soft:#e2f5e9; --bad:#d64545; --bad-soft:#fde8e8;
  --warn:#b67d00; --warn-soft:#fff3d1; --wire:#7b879b; --canvas:#fbfcfe; --grid:#e6ebf3;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.07); --r:14px;
}
/*@dark*/@media (prefers-color-scheme: dark){:root{
  --bg:#0e131b; --card:#161d28; --card2:#1c2431; --ink:#e6ebf2; --ink-soft:#b3bccb; --muted:#8b95a7; --line:#2a3443;
  --accent:#5b8ff0; --accent-soft:#1b2944; --ok:#3cc47a; --ok-soft:#14301f; --bad:#f06c6c; --bad-soft:#3a1d20;
  --warn:#e6b23a; --warn-soft:#352c14; --wire:#8592a8; --canvas:#111720; --grid:#1b2330;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);}}/*@end*/
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
body{background:var(--bg)}
.app{max-width:1800px;margin:0 auto;padding:14px;background:var(--bg);min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.hdr{display:flex;align-items:center;gap:14px}
.hdr h1{font-size:1.45rem;margin:0;line-height:1.2}
.hdr p{margin:2px 0 0;color:var(--muted)}
.hdr .grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;padding:6px;margin:12px 0;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;border-radius:999px;background:transparent;padding:8px 16px;font-weight:700;color:var(--ink-soft)}
.tabs button:hover{background:var(--card2)}
.tabs button.active{background:var(--accent);color:#fff}
button{font:inherit;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed;border-color:var(--line)}
input[type=text]{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);width:100%}
select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);max-width:100%}
details.lz{margin-bottom:12px}
details.lz summary,details.ov summary{cursor:pointer;font-weight:700}
.lzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.lzt{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.lzt b{display:block;margin-bottom:2px}
.lzt span{color:var(--ink-soft);font-size:.92rem}
.work{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:1150px){.work{grid-template-columns:200px minmax(0,1fr)}.work>.right{grid-column:1/-1}.part svg{width:60px;height:40px}}
@media (max-width:760px){.work{grid-template-columns:1fr}.tabs button{flex:1}}
@media (max-width:600px){.hdr{flex-wrap:wrap}.hdr .grow{flex:1 1 calc(100% - 64px)}.hdr h1{font-size:1.25rem}.tabs{border-radius:16px}.tabs button{flex:1 1 100%}}
.stage{padding:6px;position:relative}
.pop{position:absolute;left:14px;right:14px;top:56px;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);z-index:5;max-width:560px;margin:0 auto}
.pop h3{margin:0 0 6px;font-size:1.05rem}
.stagebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.stagebar .sp{flex:1}
.pcsvg{width:100%;height:auto;max-height:calc(100vh - 120px);display:block;border-radius:12px;background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;touch-action:none;user-select:none;-webkit-user-select:none}
.subh{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:12px 0 6px}
.subh:first-child{margin-top:0}
.msg{border-radius:12px;padding:9px 11px;background:var(--card2);border:1px solid var(--line);margin:8px 0;font-size:.95rem}
.msg.ok{background:var(--ok-soft);border-color:var(--ok)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn)}
.bar{height:10px;background:var(--grid);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.82rem;font-weight:700;margin:2px 4px 2px 0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.good{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:9px 11px;margin-top:10px;font-size:.93rem}
.good b{display:block;margin-bottom:2px}
.info h3{margin:0 0 4px;font-size:1.12rem;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.info p.lead{margin:4px 0 8px;color:var(--ink-soft)}
.info ul{margin:6px 0;padding-left:18px}
.info li{margin:3px 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.parts{max-height:680px;overflow:auto;padding-right:2px}
.part{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:7px;padding-right:22px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative}
.part:hover{border-color:var(--accent)}
.part.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.part.used,.part.rej{opacity:.45;cursor:default}
.part.used:hover,.part.rej:hover{border-color:var(--line)}
.part.lock{opacity:.4;cursor:not-allowed}
.part svg{width:56px;height:38px;flex:none}
.part.big{flex-direction:column;align-items:stretch}
.part.big svg{width:100%;height:auto}
.figure{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin:4px 0 8px}
.figure svg{width:100%;height:auto;display:block}
.legend{margin:4px 0 2px;padding-left:22px;font-size:.84rem}
.legend li{margin:2px 0}
.legend li::marker{color:#2f6fde;font-weight:800}
.part .pn{font-weight:700;font-size:.9rem;line-height:1.2;overflow-wrap:break-word}
.part .ps{font-size:.76rem;color:var(--ink-soft);line-height:1.25;margin-top:2px;overflow-wrap:break-word}
.part>div{min-width:0}
.part .badge{position:absolute;right:6px;top:4px;font-size:.8rem}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:4px;box-shadow:var(--shadow);opacity:.92}
.ghost svg{width:110px;height:74px;display:block}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:8px}
.steps button{border-radius:999px;font-weight:600;font-size:.9rem}
.steps button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.steps button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tips button{margin:4px 0;width:100%;text-align:left}
.tip{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:7px 10px;margin:4px 0;font-size:.93rem}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opts button{text-align:left;line-height:1.3}
.opts button.right{background:var(--ok-soft);border-color:var(--ok)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cmp td.unk{color:var(--muted);font-style:italic}
.tblwrap{overflow-x:auto}
.auftrag{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.88rem}
.auftrag b{display:block;margin-bottom:4px}
.auftrag ul{margin:0;padding-left:16px}
.kn-intro{max-width:820px;margin:0 auto}
.q{max-width:820px;margin:0 auto}
.q h3{margin:6px 0 10px;font-size:1.1rem}
.q .qsvg{max-width:520px;margin:6px auto;display:block;width:100%}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px 10px;align-items:center;margin:8px 0}
.match .l{font-weight:600}
.lzrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lzrow .bar{margin-top:0}
@media (max-width:600px){.lzrow{grid-template-columns:1fr}.match{grid-template-columns:1fr}}
.big{font-size:2.2rem;font-weight:800;line-height:1}
.resgrid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.proto{font-size:.88rem}
.proto td:first-child{width:28px}
svg .comp{cursor:pointer}
svg .comp:hover{filter:drop-shadow(0 0 5px #ffd166)}
svg .comp.sel{filter:drop-shadow(0 0 6px #ffd166) drop-shadow(0 0 3px #ffd166)}
svg .hot{fill:transparent;stroke:transparent;stroke-width:2;cursor:pointer}
svg .hot:hover{fill:rgba(255,209,102,.22);stroke:#ffd166}
svg .hot.seen{stroke:rgba(255,209,102,.55);stroke-dasharray:4 3}
svg .hot.cur{fill:rgba(255,209,102,.3);stroke:#ffd166}
svg .zone{fill:rgba(47,111,222,.16);stroke:#2f6fde;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
svg .zone.near{fill:rgba(47,111,222,.38);stroke-width:3}
svg .lbl{font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;paint-order:stroke;stroke:var(--canvas);stroke-width:4px;fill:var(--ink);pointer-events:none}
svg .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
svg .fade{transition:transform .38s ease-in,opacity .38s ease-in}
.noprint{}
/*@print*/@media print{.tabs,.hdr .chip,.noprint,details.lz{display:none!important}.app{background:#fff}.card{box-shadow:none}}/*@end*/
</style>
</head>
<body>
<div class="app">
  <header class="hdr card">
    <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
      <rect width="46" height="46" rx="12" fill="#2f6fde"/>
      <rect x="11" y="8" width="18" height="30" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="14.5" y="12" width="11" height="9" rx="1.5" fill="#fff"/>
      <circle cx="20" cy="29" r="3.2" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="31" y="14" width="5" height="18" rx="1.5" fill="#ffd166"/>
    </svg>
    <div class="grow">
      <h1>Plug &amp; Pray</h1>
      <p>Aufbau eines modernen PCs · Zerlegen · Zusammenbauen · Kompetenznachweis</p>
    </div>
    <span class="chip" id="scormChip">Vorschau</span>
  </header>

  <nav class="tabs card" id="tabs">
    <button data-tab="exp" class="active">① Entdecken: PC zerlegen</button>
    <button data-tab="ueb">② Üben: PC zusammenbauen</button>
    <button data-tab="kn">③ Kompetenznachweis</button>
  </nav>

  <details class="card lz" id="lzCard">
    <summary>🎯 Lernziele dieses Moduls</summary>
    <div class="lzgrid" id="lzGrid"></div>
  </details>

  <section id="tab-exp" class="tab">
    <div class="work">
      <aside class="left card" id="expLeft"></aside>
      <div class="stage card">
        <div class="stagebar">
          <button id="expViewCase" class="active">🖥 Gehäuse</button>
          <button id="expViewBoard" disabled>🔒 Mainboard erkunden</button>
          <span class="sp"></span>
          <button id="expReset">↺ Wieder zusammensetzen</button>
        </div>
        <svg id="expSvg" class="pcsvg" viewBox="0 -22 664 606" role="img" aria-label="PC zum Zerlegen"></svg>
        <div class="bar"><i id="expBar"></i></div>
        <div class="small muted" id="expStat" style="margin-top:4px"></div>
      </div>
      <aside class="right card info" id="expInfo"></aside>
    </div>
    <details class="card ov" style="margin-top:12px">
      <summary>📋 Steckbrief-Übersicht: alle untersuchten Bauteile im Vergleich</summary>
      <div class="tblwrap" id="expTable" style="margin-top:8px"></div>
    </details>
  </section>

  <section id="tab-ueb" class="tab" hidden>
    <div class="card steps" id="uebSteps"></div>
    <div class="work">
      <aside class="left card" id="uebLeft"></aside>
      <div class="stage card">
        <div class="stagebar">
          <span class="small muted" id="uebHint">Ziehe ein Teil aus der Teilekiste an seinen Platz – oder tippe erst das Teil, dann den Platz an.</span>
          <span class="sp"></span>
          <button id="uebReset">↺ Übung neu starten</button>
        </div>
        <svg id="uebSvg" class="pcsvg" viewBox="0 -22 664 606" role="img" aria-label="PC zum Zusammenbauen"></svg>
      </div>
      <aside class="right card info" id="uebRight"></aside>
    </div>
  </section>

  <section id="tab-kn" class="tab" hidden>
    <div id="knRoot"></div>
  </section>

  <div class="ghost" id="ghost" hidden></div>
</div>
<script>
var ROOT = document;
var $ = function(s, r){ return (r || ROOT).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || ROOT).querySelectorAll(s)); };
var NS = 'http://www.w3.org/2000/svg';

/* ---------- Helfer ---------- */
function S_(tag, a, p){ var e = document.createElementNS(NS, tag); if (a) for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function R(p, r, a){ a = a || {}; a.x = r.x; a.y = r.y; a.width = r.w; a.height = r.h; return S_('rect', a, p); }
function T(p, x, y, s, a){ a = a || {}; a.x = x; a.y = y; var t = S_('text', a, p); t.textContent = s; return t; }
function G(p, a){ return S_('g', a || {}, p); }
function pad(r, d){ return { x: r.x - d, y: r.y - d, w: r.w + 2 * d, h: r.h + 2 * d }; }
function H(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function clear(n){ while (n && n.firstChild) n.removeChild(n.firstChild); }
function svgPoint(svg, cx, cy, ref){ var pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; var m = (ref || svg).getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: -1, y: -1 }; }
function inR(r, x, y, d){ d = d || 0; return x >= r.x - d && x <= r.x + r.w + d && y >= r.y - d && y <= r.y + r.h + d; }

/* ---------- SCORM 1.2 ---------- */
var SC = { api: null, ok: false, done: false };
function findAPI(win){
  var n = 0;
  try {
    while (win && !win.API && win.parent && win.parent !== win && n < 12){ n++; win = win.parent; }
    return (win && win.API) ? win.API : null;
  } catch (e){ return null; }
}
function scGet(k){ try { return SC.ok ? String(SC.api.LMSGetValue(k)) : ''; } catch (e){ return ''; } }
function scSet(k, v){ try { if (SC.ok) SC.api.LMSSetValue(k, String(v)); } catch (e){} }
function scCommit(){ try { if (SC.ok) SC.api.LMSCommit(''); } catch (e){} }
function scInit(){
  var a = findAPI(window);
  try { if (!a && window.opener) a = findAPI(window.opener); } catch (e){}
  if (a){
    SC.api = a;
    try { SC.ok = String(a.LMSInitialize('')) === 'true'; } catch (e){ SC.ok = false; }
  }
  var raw = '';
  if (SC.ok){
    raw = scGet('cmi.suspend_data');
    var st = scGet('cmi.core.lesson_status');
    if (st === '' || st === 'not attempted') scSet('cmi.core.lesson_status', 'incomplete');
    scSet('cmi.core.exit', 'suspend');
    var nm = scGet('cmi.core.student_name');
    if (nm && !STORE.name){ var parts = nm.split(','); STORE.name = parts.length === 2 ? (parts[1].trim() + ' ' + parts[0].trim()) : nm; }
    scCommit();
  } else {
    try { raw = localStorage.getItem('pc-aufbau-v1') || ''; } catch (e){}
  }
  if (raw){ try { var d = JSON.parse(raw); for (var k in d) STORE[k] = d[k]; } catch (e){} }
  var chip = $('#scormChip');
  chip.textContent = SC.ok ? 'SCORM verbunden ✓' : 'Vorschau (ohne Lernplattform)';
  chip.className = 'chip' + (SC.ok ? ' ok' : '');
}
function save(){
  var s = JSON.stringify(STORE);
  if (SC.ok){ scSet('cmi.suspend_data', s.slice(0, 4000)); scCommit(); }
  else { try { localStorage.setItem('pc-aufbau-v1', s); } catch (e){} }
}
function scReport(score){
  var best = STORE.best == null ? -1 : STORE.best;
  if (score > best){ STORE.best = score; best = score; }
  if (SC.ok){
    scSet('cmi.core.score.min', 0); scSet('cmi.core.score.max', 100);
    scSet('cmi.core.score.raw', best);
    scSet('cmi.core.lesson_status', best >= PASS ? 'passed' : 'failed');
  }
  save();
}
function scFinish(){
  if (!SC.ok || SC.done) return; SC.done = true;
  try { SC.api.LMSCommit(''); SC.api.LMSFinish(''); } catch (e){}
}
window.addEventListener('pagehide', scFinish);
window.addEventListener('beforeunload', scFinish);

var PASS = 70;
var STORE = { seen: [], expDone: false, ueb: [], best: null, tries: 0, name: '' };

/* ---------- Lernziele ---------- */
var LZ = [
  { id: 'LZ1', t: 'Komponenten erkennen', d: 'Ich erkenne die Komponenten eines modernen PCs – auch in anderer Bauform – und benenne sie fachlich korrekt.' },
  { id: 'LZ2', t: 'Funktionen beschreiben', d: 'Ich beschreibe die wesentliche Aufgabe jeder Komponente und wichtige Kennzahlen.' },
  { id: 'LZ3', t: 'Steckplätze & Anschlüsse', d: 'Ich ordne Bauteile und Stromkabel den richtigen Steckplätzen und Anschlüssen zu.' },
  { id: 'LZ4', t: 'Sicher & in sinnvoller Reihenfolge', d: 'Ich baue sicher (Strom, ESD) und in sinnvoller Reihenfolge ein und aus – inklusive Wärmeleitpaste und Airflow.' },
  { id: 'LZ5', t: 'Kompatibilität prüfen', d: 'Ich wähle passende Teile nach Kundenauftrag aus: Sockel, RAM-Typ, Formfaktor, Grafikkartenlänge, Netzteilleistung.' }
];
var LZ_TIP = {
  LZ1: 'Zerlege den PC unter ① noch einmal und erkunde das Mainboard auf der Werkbank. Achte darauf, wie Bauteile in anderer Bauform aussehen (z. B. AIO-Kühler statt Tower-Kühler).',
  LZ2: 'Lies in ① die Steckbriefe und vergleiche sie in der Steckbrief-Übersicht. Erkläre jemandem die Aufgabe jedes Teils in einem Satz.',
  LZ3: 'Erkunde in ① die Board-Details (Sockel, Slots, Stecker) und baue in ② Aufgabe 4, 6 und 7 noch einmal – zähl bei Steckern die Pins.',
  LZ4: 'Wiederhole ② Aufgabe 1, 5 und 7: Strom/ESD, Reihenfolge (RAM vor Tower-Kühler, SSD vor GPU), Wärmeleitpaste und Luftrichtung.',
  LZ5: 'Wiederhole ② Aufgabe 1, 3, 4 und 6 – vergleiche jede Teilekarte mit dem Kundenauftrag: Sockel, DDR-Generation, DIMM/SO-DIMM, Länge, Watt.'
};

/* ---------- Kategorienfarben ---------- */
var CAT = { strom: '#d64545', board: '#2f9e5b', cpu: '#e8862a', speicher: '#8e5bd6', gpu: '#2f7fd6', gehaeuse: '#14958a' };

/* ---------- Steckbriefe der Komponenten ---------- */
var INFO = {

  if (w === 'atx'){
    var r = pad(g.atx, 1), cy = r.y + r.h / 2;
    wire([P3(r.x + r.w, cy, 20), P3(r.x + r.w + 26, cy, 22), P3(424, cy, 14), P3(425, cy, 0)], 13);
    box(p, r, 14, 30, c, { rx: 2 }); pins(fG(p, 30), pad(r, -3), 2, 12, B ? '#c3cad3' : '#2a2d33');
  } else if (w === 'eps'){

    wire([P3(cx, e.y, 18), P3(cx, e.y - 10, 18), P3(cx, 46, 8), P3(cx, 40, 0)], 9);
    box(p, e, 12, 26, c, { rx: 2 }); pins(fG(p, 26), pad(e, -3), 4, 2, B ? '#c3cad3' : '#2a2d33');
  } else if (w === 'gpu'){
    var q = g.gpuPwr, gx = q.x + q.w / 2;
    wire([P3(gx, q.y + 2, 104), P3(gx + 50, q.y - 10, 104), P3(480, 380, 70), P3(g.psu.x + g.psu.w - 20, g.psu.y + 10, 60)], 9, LIGHT, LIGHT_S);
    box(p, { x: q.x - 1, y: q.y - 1, w: q.w + 2, h: q.h + 2 }, 98, 110, LIGHT, { rx: 2, stroke: '#7d858f' });
  } else if (w === 'fp'){
    var f = g.fpanel, cols = ['#d64545', '#111', '#2f7fd6', '#e8e8e8'];
    cols.forEach(function(col, i){ var a = P3(f.x + 6 + i * 11, f.y + f.h, 13), b = P3(400 + i * 6, g.shroud.y + g.shroud.h - 10, 30); S_('path', { d: 'M' + a + ' Q' + P3(f.x + 10 + i * 10, f.y + 30, 20) + ' ' + b, stroke: col, 'stroke-width': 2, fill: 'none' }, p); });
    box(p, pad(f, 0.5), 9, 16, '#2a2d33', { rx: 1 });

/* Gesamtzeichnung. S = Zustand, opts.comp = Gruppen anklickbar (Entdecken), opts.zones = Ablageflächen */
function renderPC(svg, key, S, opts){
  opts = opts || {};
  clear(svg);
  var K = { key: key, g: GEO[key], p: PAL[key] };
  K.g.shroud = K.g.shroud || { x: 38, y: 452, w: 564, h: 114 };
  var defId = makeDefs(svg);
  function grp(id){ return opts.comp ? G(svg, { 'class': 'comp' + (opts.sel === id ? ' sel' : ''), 'data-comp': id }) : G(svg, { 'data-part': id }); }
  drawShell(svg, K, S);
  if (S.board) drawBoard(svg, K, opts.comp ? { 'class': 'comp' + (opts.sel === 'board' ? ' sel' : ''), 'data-comp': 'board' } : {});
  if (S.cpu) drawCPU(grp('cpu'), K, S);
  if (S.ram && S.ram.some(Boolean)){ var rg = grp('ram'); [3, 2, 1, 0].forEach(function(i){ if (S.ram[i]) drawRAM(rg, K, i, defId); }); }
  if (S.ssd) drawSSD(grp('ssd'), K);
  if (S.cooler) drawCooler(grp('cooler'), K, defId);
  if (S.gpu) drawGPU(grp('gpu'), K, S);
  drawCage(svg, K, false);
  if (S.sata) drawSata(grp('sata'), K, S);
  drawCage(svg, K, true);
  var cl = ['atx', 'eps', 'fp', 'gpu'].filter(function(w){ return S.plugs && S.plugs[w]; });
  var sc = S.sata && S.plugs && (S.plugs.sdata || S.plugs.spwr);
  if (cl.length || sc){ var cg = grp('cables'); cl.forEach(function(w){ drawCable(cg, K, w); }); if (sc) drawSataCables(cg, K, S); }
  if (S.psu) drawPSU(grp('psu'), K, S.psuW);
  var fz = ['fan_f1', 'fan_f2', 'fan_rear'].filter(function(z){ return S.fans && S.fans[z]; });
  if (fz.length){
    if (opts.comp){ var fg = grp('fans'); fz.forEach(function(z){ drawFan(fg, K, z, S.fans[z]); }); }
    else fz.forEach(function(z){ drawFan(G(svg, { 'data-fan': z, style: 'cursor:pointer' }), K, z, S.fans[z]); });
  }
  if (S.power) drawCord(grp('power'), K);
  drawRim(svg, K);
  if (S.panel) drawPanel(grp('panel'), K, defId);
  if (opts.zones){
    var zl = G(svg, {});
    opts.zones.forEach(function(z){ var b = zoneBox(K, z); poly(zl, hull(pad(b.r, 2), b.z0, b.z1), { 'class': 'zone' + (opts.near === z ? ' near' : ''), 'data-zone': z, 'stroke-linejoin': 'round' }); });
  }
  return K;
}
function zoneBox(K, z){
  var g = K.g;
  if (/^dimm\d$/.test(z)) return { r: ramRect(K, +z.slice(4)), z0: 3, z1: 30 };
  var m = {
    psu: [g.psu, 8, 112], board: [g.board, 0, 3], socket: [g.socket, 3, 10], m2: [g.m2, 3, 8], pcie16: [g.pcie16, 3, 12], pcieX: [g.pcieX, 3, 11], sata: [g.sata, 3, 12],
    fan_rear: [g.fan_rear, 8, 112], fan_f1: [g.fan_f1, 8, 112], fan_f2: [g.fan_f2, 8, 112],
    bay: [g.sata25, SZ0, SZ1], p_spwr: [sataPorts(g).pwr, SZ0, SZ1],
    p_atx: [g.atx, 3, 14], p_eps: [g.eps, 3, 12], p_gpu: [g.gpuPwr, 98, 100], p_fp: [g.fpanel, 3, 9], p_cpufan: [g.cpufan, 3, 8]
  }[z];
  return m ? { r: m[0], z0: m[1], z1: m[2] } : null;

function zoneRect(K, z){ var b = zoneBox(K, z); return b ? pb(b.r, b.z0, b.z1) : null; }
function hotRects(K){
  var g = K.g, d = g.dimm;
  return [
    { id: 'socket', r: pb(pad(g.socket, 3), 3, 7) }, { id: 'vrm', r: pb(g.vrmT, 3, 17) }, { id: 'vrm', r: pb(g.vrmL, 3, 17) },
    { id: 'dimm', r: pb({ x: d[0].x - 2, y: d[0].y - 6, w: d[3].x + d[3].w - d[0].x + 4, h: d[0].h + 12 }, 3, 11) },

    { id: 'm2', r: pb(g.m2, 3, 7) }, { id: 'chipset', r: pb(g.chipset, 3, 9) }, { id: 'sata', r: pb(g.sata, 3, 12) }, { id: 'cmos', r: pb(g.cmos, 3, 6) }, { id: 'bios', r: pb(g.bios, 3, 5) },

/* ================== Produktansichten der Bauteile (nah am Original) ==================
   partSVG(kind, key, callouts) zeichnet ein Bauteil in viewBox 0 0 240 160.
   Wird für Teilekiste, Ziehbild, Bildfragen und die Nahansicht (mit nummerierten Hinweisen) genutzt. */
var PART_UID = 0;
function partSVG(kind, key, withCallouts){
  key = key || 'A';
  var B = key === 'B', P = PAL[key];
  var svg = S_('svg', { viewBox: '0 0 240 160', 'aria-hidden': 'true', 'class': 'partsvg' });
  var id = 'pp' + (++PART_UID), defs = S_('defs', {}, svg);
  function grad(name, stops, x2, y2){
    var g = S_('linearGradient', { id: id + name, x1: 0, y1: 0, x2: x2 == null ? 0 : x2, y2: y2 == null ? 1 : y2 }, defs);
    stops.forEach(function(s, i){ S_('stop', { offset: (i / (stops.length - 1)).toFixed(2), 'stop-color': s }, g); });
  }
  grad('alu', ['#eef1f4', '#c3cad2', '#9ea7b1']);
  grad('aluH', ['#e3e7eb', '#aab2bb'], 1, 0);
  grad('metD', ['#5a626c', '#2f343b']);
  grad('gold', ['#f6dc8c', '#c99a2e']);
  grad('pcbG', ['#2f7a4c', '#1d5233']);
  grad('pcbK', ['#2c3036', '#15171b']);
  grad('plK', ['#3d424a', '#1b1e23']);
  grad('plW', ['#ffffff', '#dfe4ea']);
  grad('cu', ['#f0b27a', '#b56a2c'], 1, 0);
  grad('rgb', ['#ff5fa2', '#8e5bd6', '#2f9ee0', '#2fd0a0', '#ffd166'], 1, 0);
  grad('glass', ['rgba(190,215,255,.55)', 'rgba(190,215,255,.18)', 'rgba(190,215,255,.45)'], 1, 1);
  function u(n){ return 'url(#' + id + n + ')'; }
  var C = { u: u, B: B, P: P, key: key };
  S_('ellipse', { cx: 120, cy: 152, rx: 92, ry: 5, fill: 'rgba(20,30,50,.12)' }, svg);
  var g = G(svg, {});
  (PARTS[kind] || PARTS.ssd)(g, C);
  if (withCallouts && CALLOUTS[kind]){
    CALLOUTS[kind].forEach(function(c, i){
      var m = G(svg, { 'class': 'callout' });
      S_('circle', { cx: c[0], cy: c[1], r: 7.5, fill: '#2f6fde', stroke: '#fff', 'stroke-width': 1.8 }, m);
      T(m, c[0], c[1] + 3, String(i + 1), { 'text-anchor': 'middle', 'font-size': 8.5, 'font-weight': 800, fill: '#fff' });

function icon(kind, key){ return partSVG(kind, key, false); }
function partFigure(kind, key){

  return wrap;

function goldFingers(p, x0, x1, y, h, step, skip, C){
  for (var x = x0; x < x1; x += step){ if (skip && x > skip[0] - 1.5 && x < skip[1]) continue; rr_(p, x, y, step * 0.62, h, { fill: C.u('gold') }); }

function smd(p, pts, col){ pts.forEach(function(q){ rr_(p, q[0], q[1], q[2] || 3, q[3] || 1.8, { fill: col || '#b98c5a' }); }); }

  for (var i = 0; i < 7; i++){

    var p1 = [cx + Math.cos(b) * r * 0.9, cy + Math.sin(b) * r * 0.9];

function wires(p, x0, x1, yTop, yBot, n, col, conv){

  else h += '<div class="msg ok">✅ Teil A abgeschlossen.</div><div class="btnrow"><button class="primary" id="knToB">Weiter zu Teil B: Wissensfragen →</button></div>';
  box.innerHTML = h; knMsg();
  var pb = $('#knPanel'); if (pb) pb.onclick = function(){ closePanel(c); };
  var pw = $('#knPower'); if (pw) pw.onclick = function(){ pw.disabled = true; pb.disabled = true; powerOn(c, function(){ ck(c, 'airflow', airOK(S)); ck(c, 'order', true); c.posted = true; knRight(); }); };
  var tb = $('#knToB'); if (tb) tb.onclick = knQuizStart;
}
function knMsg(){ var c = KN.ctx, box = $('#knMsg'); if (!box) return; box.innerHTML = c.msg ? '<div class="msg ' + c.msg.cls + '">' + c.msg.html + '</div>' : ''; }

/* ---------- Teil B ---------- */
function knQuizStart(){
  var qs = [];
  Object.keys(QPLAN).forEach(function(lz){ qs = qs.concat(shuffle(QS.filter(function(q){ return q.lz === lz; })).slice(0, QPLAN[lz])); });
  KN.qs = shuffle(qs); KN.qi = 0; KN.res = []; KN.phase = 'quiz';
  knQ();
}
function knQ(){
  var q = KN.qs[KN.qi], root = $('#knRoot'), checked = false, sel = null, hotPt = null;
  var h = '<div class="card q"><div class="subh">Teil B · Frage ' + (KN.qi + 1) + ' von ' + KN.qs.length + '</div><div class="bar"><i style="width:' + Math.round(KN.qi / KN.qs.length * 100) + '%"></i></div>';
  h += '<h3>' + esc(q.q) + '</h3><div id="qBody"></div><div id="qFb"></div><div class="btnrow"><button class="primary" id="qCheck">Antwort prüfen</button></div></div>';
  root.innerHTML = h;
  var body = $('#qBody'), order = null;
  if (q.t === 'mc' || q.t === 'img'){
    if (q.t === 'img'){ var ic = icon(q.icon, 'B'); ic.setAttribute('class', 'qsvg'); ic.style.maxWidth = '260px'; ic.style.background = 'var(--canvas)'; ic.style.borderRadius = '12px'; body.appendChild(ic); }
    order = shuffle(q.o.map(function(o, i){ return i; }));
    var od = H('div', 'opts'); order.forEach(function(i){ var b = H('button', '', esc(q.o[i])); b.setAttribute('data-i', i); b.onclick = function(){ if (checked) return; sel = i; $$('button', od).forEach(function(x){ x.classList.toggle('active', x === b); }); }; od.appendChild(b); });
    body.appendChild(od);
  } else if (q.t === 'match'){
    var rights = shuffle(q.p.map(function(p){ return p[1]; }));
    var md = H('div', 'match');
    q.p.forEach(function(p, i){ md.appendChild(H('div', 'l', esc(p[0]))); var s = H('select', ''); s.setAttribute('data-i', i); s.innerHTML = '<option value="">– bitte wählen –</option>' + rights.map(function(r){ return '<option>' + esc(r) + '</option>'; }).join(''); md.appendChild(s); });
    body.appendChild(md);
  } else if (q.t === 'num'){
    body.innerHTML = '<div style="display:flex;gap:8px;align-items:center;max-width:280px"><input type="text" inputmode="decimal" id="qNum" placeholder="Zahl"><b>' + esc(q.unit) + '</b></div>';
  } else if (q.t === 'hot'){
    var K = { key: 'B', g: GEO.B, p: PAL.B }, b = withKZ(BENCH_KZ, function(){ return pb(K.g.board, 0, 36); });
    var svg = S_('svg', { viewBox: (b.x - 10) + ' ' + (b.y - 10) + ' ' + (b.w + 20) + ' ' + (b.h + 20), 'class': 'qsvg pcsvg' });
    body.appendChild(svg); withKZ(BENCH_KZ, function(){ drawBoard(svg, K, null, true); });
    var mk = S_('circle', { r: 6, fill: 'none', stroke: '#ffd166', 'stroke-width': 3, cx: -50, cy: -50 }, svg);
    svg.addEventListener('click', function(ev){ if (checked) return; var p = svgPoint(svg, ev.clientX, ev.clientY); hotPt = p; mk.setAttribute('cx', p.x); mk.setAttribute('cy', p.y); });
    body.appendChild(H('p', 'small muted', 'Tippe/klicke auf die gesuchte Stelle – der gelbe Kreis zeigt deine Auswahl.'));
  }
  $('#qCheck').onclick = function(){
    if (checked){ KN.qi++; if (KN.qi >= KN.qs.length) knResult(); else knQ(); return; }
    var ok = false, answered = true;
    if (q.t === 'mc' || q.t === 'img'){ if (sel == null) answered = false; else { ok = sel === q.a; $$('#qBody .opts button').forEach(function(x){ var i = +x.getAttribute('data-i'); if (i === q.a) x.classList.add('right'); else if (i === sel) x.classList.add('wrong'); }); } }
    else if (q.t === 'match'){ var ss = $$('#qBody select'); if (ss.some(function(s){ return !s.value; })) answered = false; else { ok = ss.every(function(s){ return s.value === q.p[+s.getAttribute('data-i')][1]; }); ss.forEach(function(s){ var r = s.value === q.p[+s.getAttribute('data-i')][1]; s.style.borderColor = r ? 'var(--ok)' : 'var(--bad)'; s.disabled = true; }); } }
    else if (q.t === 'num'){ var v = parseFloat(String($('#qNum').value).replace(',', '.')); if (isNaN(v)) answered = false; else { ok = Math.abs(v - q.a) < 0.001; $('#qNum').disabled = true; } }
    else if (q.t === 'hot'){
      if (!hotPt) answered = false;
      else {
        var K2 = { key: 'B', g: GEO.B, p: PAL.B }, rs = withKZ(BENCH_KZ, function(){ return hotRects(K2); }).filter(function(h){ return h.id === q.target; });
        ok = rs.some(function(h){ return inR(h.r, hotPt.x, hotPt.y, 6); });
        var sv = $('#qBody svg'); rs.forEach(function(h){ R(sv, pad(h.r, 4), { rx: 3, fill: 'rgba(31,157,85,.25)', stroke: '#1f9d55', 'stroke-width': 2.5 }); });
      }
    }
    if (!answered){ $('#qFb').innerHTML = '<div class="msg warn">Bitte zuerst antworten.</div>'; return; }
    checked = true;
    KN.res.push({ q: q, ok: ok });
    var extra = (!ok && q.t === 'match') ? '<br><span class="small">Richtig: ' + q.p.map(function(p){ return esc(p[0]) + ' → ' + esc(p[1]); }).join(' · ') + '</span>' : (!ok && q.t === 'num') ? '<br><span class="small">Richtig: ' + q.a + ' ' + esc(q.unit) + '</span>' : '';
    $('#qFb').innerHTML = '<div class="msg ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✅ Richtig! ' : '⛔ Leider falsch. ') + esc(q.ex) + extra + '</div>';
    $('#qCheck').textContent = KN.qi === KN.qs.length - 1 ? 'Zur Auswertung →' : 'Nächste Frage →';
  };
}

/* ---------- Auswertung ---------- */
function knResult(){
  KN.phase = 'result';
  var c = KN.ctx, CK = c.CK;
  var aOk = CKDEF.filter(function(d){ return CK[d[0]] === true; }).length;
  var bOk = KN.res.filter(function(r){ return r.ok; }).length;
  var score = Math.round(50 * aOk / CKDEF.length + 50 * bOk / KN.res.length);
  STORE.tries = (STORE.tries || 0) + 1; scReport(score);
  var lzr = LZ.map(function(l){
    var a = CKDEF.filter(function(d){ return d[1] === l.id; }), b = KN.res.filter(function(r){ return r.q.lz === l.id; });
    var got = a.filter(function(d){ return CK[d[0]] === true; }).length + b.filter(function(r){ return r.ok; }).length, tot = a.length + b.length;
    return { l: l, p: tot ? Math.round(got / tot * 100) : 0, got: got, tot: tot };
  });
  var passed = score >= PASS, date = new Date().toLocaleDateString('de-DE');
  var h = '<div class="card" id="knRes" style="max-width:980px;margin:0 auto">';
  h += '<div class="subh">Ergebnis Kompetenznachweis „Plug &amp; Pray – Aufbau eines modernen PCs“</div>';
  h += '<div class="resgrid"><div class="big" style="color:' + (passed ? 'var(--ok)' : 'var(--bad)') + '">' + score + ' %</div><div><span class="chip ' + (passed ? 'ok' : 'bad') + '">' + (passed ? '✅ bestanden' : '✖ noch nicht bestanden') + ' (ab ' + PASS + ' %)</span><br>' +
    '<span class="small">Teil A Zusammenbau: ' + aOk + ' / ' + CKDEF.length + ' Prüfpunkte · Teil B Wissen: ' + bOk + ' / ' + KN.res.length + ' Fragen</span><br>' +
    '<span class="small muted">' + esc(STORE.name || 'ohne Namen') + ' · ' + date + ' · Übungen erledigt: ' + STORE.ueb.length + ' / ' + USTEPS.length + ' · bestes Ergebnis: ' + STORE.best + ' %</span></div></div>';
  h += '<div class="subh">Auswertung nach Lernzielen</div>';
  lzr.forEach(function(r){
    var cls = r.p >= 80 ? 'ok' : r.p >= 50 ? 'warn' : 'bad', st = r.p >= 80 ? '✔ erreicht' : r.p >= 50 ? '½ teilweise' : '✖ noch nicht';
    h += '<div class="lzrow"><div><b>' + r.l.id + ' · ' + esc(r.l.t) + '</b><br><span class="small muted">' + esc(r.l.d) + '</span></div><div><div class="bar ' + cls + '"><i style="width:' + r.p + '%"></i></div><span class="small">' + r.got + ' / ' + r.tot + ' (' + r.p + ' %)</span></div><div><span class="chip ' + cls + '">' + st + '</span></div></div>';
    if (r.p < 80) h += '<div class="small" style="padding:4px 0 8px">📌 <b>Empfehlung:</b> ' + esc(LZ_TIP[r.l.id]) + '</div>';
  });
  h += '<div class="subh">Protokoll Teil A – Zusammenbau</div><div class="tblwrap"><table class="cmp proto"><tbody>' +
    CKDEF.map(function(d){ var v = CK[d[0]] === true; return '<tr><td>' + (v ? '✅' : '❌') + '</td><td>' + esc(d[2]) + '</td><td class="muted">' + d[1] + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '<div class="subh">Protokoll Teil B – Wissensfragen</div><div class="tblwrap"><table class="cmp proto"><tbody>' +
    KN.res.map(function(r){ return '<tr><td>' + (r.ok ? '✅' : '❌') + '</td><td>' + esc(r.q.q) + '</td><td class="muted">' + r.q.lz + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '<div class="noprint"><div class="subh">Name für den Ausdruck</div><input type="text" id="resName" value="' + esc(STORE.name || '') + '" placeholder="Vorname Nachname">' +
    '<div class="btnrow"><button class="primary" id="resPrint">🖨 Ergebnis drucken / als PDF</button><button id="resAgain">↺ Neuer Versuch</button><button id="resUeb">② Zurück zum Üben</button></div>' +
    (SC.ok ? '<div class="msg ok small">Dein bestes Ergebnis (' + STORE.best + ' %) wurde an die Lernplattform übertragen.</div>' : '<div class="msg small">Vorschau-Modus: Ohne Lernplattform wird nichts übertragen.</div>') + '</div>';
  h += '</div>';
  $('#knRoot').innerHTML = h;
  $('#resName').oninput = function(){ STORE.name = this.value.trim(); save(); };
  $('#resPrint').onclick = function(){ var n = STORE.name ? esc(STORE.name) : 'ohne Namen'; var sp = $('#knRes .resgrid .muted'); if (sp) sp.innerHTML = n + ' · ' + date + ' · Übungen erledigt: ' + STORE.ueb.length + ' / ' + USTEPS.length + ' · bestes Ergebnis: ' + STORE.best + ' %'; printResult('#knRes'); };
  $('#resAgain').onclick = knIntro;
  $('#resUeb').onclick = function(){ showTab('ueb'); };
}
function printResult(boxSel){
  var css = ROOT.querySelector('style').textContent.split(':host').join('body').split(':root').join('body');
  var box = $(boxSel).cloneNode(true); $$('.noprint', box).forEach(function(n){ n.remove(); });
  var w = null; try { w = window.open('', '_blank'); } catch (_){}
  if (!w){ window.print(); return; }
  w.document.write('<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Ergebnis – Plug &amp; Pray</title><style>' + css + ' body{margin:20px;background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact}</style></head><body>' + box.outerHTML + '</body></html>');
  w.document.close(); setTimeout(function(){ try { w.focus(); w.print(); } catch (_){} }, 300);
}

/* ================== Start ================== */
function showTab(t){
  $$('#tabs button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === t); });
  $$('.tab').forEach(function(s){ s.hidden = s.id !== 'tab-' + t; });
  try { window.scrollTo(0, 0); } catch (_){}
}
function init(){
  scInit();
  $('#lzGrid').innerHTML = LZ.map(function(l){ return '<div class="lzt"><b>' + l.id + ' · ' + esc(l.t) + '</b><span>' + esc(l.d) + '</span></div>'; }).join('');
  $$('#tabs button').forEach(function(b){ b.onclick = function(){ showTab(b.getAttribute('data-tab')); }; });
  expInit(); uebInit(); knInit();
}
init();

</script>
</body>
</html>
